name: Bug report
description: Report a problem with Canban.
body:
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Describe the problem and its effect on your work.
      placeholder: When I ..., Canban ...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps or triggering context
      description: List the steps to reproduce it. If it is intermittent, describe what you were doing when it happened.
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Report issue in Canban fills this in automatically. You can edit it or paste the output of Settings → Copy diagnostics.
      value: |
        Canban version:
        OS and architecture:
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Screenshots or additional context
      description: Attach screenshots or add any other information that helps explain the problem.
    validations:
      required: false
