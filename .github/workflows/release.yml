name: Release
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  ci-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CANBAN_RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Wait for green CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py ci-gate

  macos:
    needs: ci-gate
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      version: ${{ steps.identity.outputs.version }}
    env:
      CANBAN_RELEASE_COMMIT: ${{ github.sha }}
      CANBAN_UPDATES_DISABLED: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ~/Library/Caches/canban
          shared-key: release-macos
      - name: Install build and integration test dependencies
        env:
          HC_VERSION: '0.1.21'
        run: |
          if ! command -v rsvg-convert >/dev/null 2>&1; then
            brew install librsvg
          fi
          mkdir -p "$HOME/.local/bin"
          curl --retry 3 --retry-all-errors -fsSL https://releases.herdr.dev/core/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Reserve immutable release identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py reserve
      - name: Build release bundle
        env:
          CANBAN_RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: mise run build-release
      - name: Package verified artifact
        env:
          CANBAN_RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: python3 scripts/release.py package
      - name: Validate packaged archive upgrade from latest published release
        env:
          GH_TOKEN: ${{ github.token }}
          CANBAN_RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: /usr/bin/python3 scripts/run-acceptance.py --retries 1 -- scripts/test-release-upgrade.py --dist dist
      - uses: actions/upload-artifact@v7
        with:
          name: canban-macos-${{ steps.identity.outputs.version }}
          path: dist/

  linux:
    needs: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    env:
      CANBAN_RELEASE_COMMIT: ${{ github.sha }}
      CANBAN_RELEASE_VERSION: ${{ needs.macos.outputs.version }}
      CANBAN_UPDATES_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ~/.cache/canban
          shared-key: release-linux
      - name: Install Linux desktop build and test dependencies
        env:
          HC_VERSION: '0.1.21'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-4-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            librsvg2-bin \
            zstd
          mkdir -p "$HOME/.local/bin"
          curl --retry 3 --retry-all-errors -fsSL https://releases.herdr.dev/core/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build Linux desktop release bundle and headless CLI
        run: mise run build-release
      - name: Run Linux installer regression tests
        run: python3 scripts/run-acceptance.py --retries 1 -- scripts/test-install.py --bundle .local/canban
      - name: Package verified Linux desktop and CLI artifacts
        run: |
          python3 scripts/release.py package --directory dist
          python3 scripts/release.py package-cli --directory dist/cli
      - uses: actions/upload-artifact@v7
        with:
          name: canban-linux-${{ matrix.arch }}-${{ needs.macos.outputs.version }}
          path: dist/

  publish:
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CANBAN_RELEASE_COMMIT: ${{ github.sha }}
      CANBAN_RELEASE_VERSION: ${{ needs.macos.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: canban-*-${{ needs.macos.outputs.version }}
          path: dist/
          merge-multiple: true
      - name: Verify release scripts and multi-platform manifests
        run: |
          python3 scripts/test-release.py
          python3 scripts/release.py verify-dist --directory dist
      - uses: actions/upload-artifact@v7
        with:
          name: canban-${{ needs.macos.outputs.version }}
          path: dist/
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish --require-all-platforms
