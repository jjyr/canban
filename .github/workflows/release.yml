name: Release
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CANBAN_RELEASE_COMMIT: ${{ github.sha }}
      CANBAN_UPDATES_DISABLED: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ~/Library/Caches/canban
      - name: Install build and integration test dependencies
        env:
          HC_VERSION: '0.1.21'
        run: |
          if ! command -v rsvg-convert >/dev/null 2>&1; then
            brew install librsvg
          fi
          mkdir -p "$HOME/.local/bin"
          curl --retry 3 --retry-all-errors -fsSL https://releases.herdr.dev/core/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run unit and packaging tests
        run: |
          mise run test
          mise run test-release
          mise run test-package
          mise run test-dev
      - name: Run integration and installer tests
        run: |
          mise run test-integration
          /usr/bin/python3 scripts/test-install.py
      - name: Reserve immutable release identity
        id: identity
        run: python3 scripts/release.py reserve
      - name: Build release bundle
        env:
          CANBAN_RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: mise run build-release
      - name: Package verified artifact
        env:
          CANBAN_RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: python3 scripts/release.py package
      - uses: actions/upload-artifact@v7
        with:
          name: canban-${{ steps.identity.outputs.version }}
          path: dist/
      - name: Publish release
        env:
          CANBAN_RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: python3 scripts/release.py publish
