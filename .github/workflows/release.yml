name: Release
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  ci-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    outputs:
      version: ${{ steps.identity.outputs.version }}
    env:
      CANBAN_RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Wait for green CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py ci-gate
      - name: Reserve immutable release identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py reserve

  macos:
    needs: ci-gate
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CANBAN_RELEASE_COMMIT: ${{ github.sha }}
      CANBAN_RELEASE_VERSION: ${{ needs.ci-gate.outputs.version }}
      CANBAN_UPDATES_DISABLED: '1'
      CARGO_INCREMENTAL: '0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Compute mise tool cache key
        run: python3 scripts/ci-cache.py mise-tools-hash --github-env
      - uses: jdx/mise-action@v5
        with:
          cache_key: '{{cache_key_prefix}}-{{platform}}-p{{cache_period}}-{{env.MISE_TOOLS_HASH}}'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ~/Library/Caches/canban
          shared-key: release-macos
          cache-on-failure: true
      - name: Install build and integration test dependencies
        env:
          HC_VERSION: '0.1.21'
        run: |
          if ! command -v rsvg-convert >/dev/null 2>&1; then
            brew install librsvg
          fi
          mkdir -p "$HOME/.local/bin"
          curl --retry 3 --retry-all-errors -fsSL https://releases.herdr.dev/core/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build release bundle
        run: mise run build-release
      - name: Package verified artifact
        run: python3 scripts/release.py package
      - name: Validate packaged archive upgrade from latest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 scripts/run-acceptance.py --retries 1 -- scripts/test-release-upgrade.py --dist dist
      - uses: actions/upload-artifact@v7
        with:
          name: canban-macos-${{ needs.ci-gate.outputs.version }}
          path: dist/

  linux:
    needs: ci-gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    env:
      CANBAN_RELEASE_COMMIT: ${{ github.sha }}
      CANBAN_RELEASE_VERSION: ${{ needs.ci-gate.outputs.version }}
      CANBAN_UPDATES_DISABLED: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Compute mise tool cache key
        run: python3 scripts/ci-cache.py mise-tools-hash --github-env
      - uses: jdx/mise-action@v5
        with:
          cache_key: '{{cache_key_prefix}}-{{platform}}-p{{cache_period}}-{{env.MISE_TOOLS_HASH}}'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ~/.cache/canban
          shared-key: release-linux
          cache-on-failure: true
      - name: Install Linux desktop build and test dependencies
        env:
          HC_VERSION: '0.1.21'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-4-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            librsvg2-bin \
            zstd
          mkdir -p "$HOME/.local/bin"
          curl --retry 3 --retry-all-errors -fsSL https://releases.herdr.dev/core/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build Linux desktop release bundle and headless CLI
        run: mise run build-release
      - name: Run Linux installer regression tests
        run: python3 scripts/run-acceptance.py --retries 1 -- scripts/test-install.py --bundle .local/canban
      - name: Package verified Linux desktop and CLI artifacts
        run: |
          python3 scripts/release.py package --directory dist
          python3 scripts/release.py package-cli --directory dist/cli
      - uses: actions/upload-artifact@v7
        with:
          name: canban-linux-${{ matrix.arch }}-${{ needs.ci-gate.outputs.version }}
          path: dist/

  android:
    needs: ci-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CANBAN_RELEASE_COMMIT: ${{ github.sha }}
      CANBAN_RELEASE_VERSION: ${{ needs.ci-gate.outputs.version }}
      CANBAN_UPDATES_DISABLED: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Verify Android release signing secrets
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEYSTORE_PASS" ]; then
            echo "::error::Missing Android release signing secrets. Configure ANDROID_KEYSTORE_B64, ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASS (and optional ANDROID_KEY_PASS) in GitHub repository secrets."
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Compute mise tool cache key
        run: python3 scripts/ci-cache.py mise-tools-hash --github-env
      - uses: jdx/mise-action@v5
        with:
          cache_key: '{{cache_key_prefix}}-{{platform}}-p{{cache_period}}-{{env.MISE_TOOLS_HASH}}'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ~/.cache/canban
          shared-key: release-android
          cache-on-failure: true
      - name: Install Android SDK/NDK and icon build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          NDK_PKG="ndk;27.3.13750724"
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.1"
          else
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.1" "$NDK_PKG"
          fi
      - name: Build and sign Android release APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          mise run terminal-deps
          mise exec -- python3 scripts/android.py build-apk --release --out dist/Canban-android-arm64-v8a.apk --cert-sha256-out dist/android-signing-sha256.txt
      - name: Package Android release manifest
        run: |
          python3 scripts/release.py package-android --directory dist --apk dist/Canban-android-arm64-v8a.apk --signing-sha256 "$(cat dist/android-signing-sha256.txt)"
          rm -f dist/android-signing-sha256.txt
      - uses: actions/upload-artifact@v7
        with:
          name: canban-android-${{ needs.ci-gate.outputs.version }}
          path: dist/

  publish:
    needs: [ci-gate, macos, linux, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CANBAN_RELEASE_COMMIT: ${{ github.sha }}
      CANBAN_RELEASE_VERSION: ${{ needs.ci-gate.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: canban-*-${{ needs.ci-gate.outputs.version }}
          path: dist/
          merge-multiple: true
      - name: Verify release scripts and multi-platform manifests
        run: |
          python3 scripts/test-release.py
          python3 scripts/release.py verify-dist --directory dist
      - uses: actions/upload-artifact@v7
        with:
          name: canban-${{ needs.ci-gate.outputs.version }}
          path: dist/
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish --require-all-platforms

  cache-prune:
    needs: [macos, linux, android]
    if: always() && (needs.macos.result == 'success' || needs.linux.result == 'success' || needs.android.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Prune superseded GitHub Actions caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-cache.py prune --keep-per-bucket 1 --best-effort
