name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      CANBAN_UPDATES_DISABLED: '1'
      CARGO_INCREMENTAL: '0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      NEXTEST_PROFILE: ci
      CANBAN_ACCEPTANCE_RETRIES: '1'
    steps:
      - uses: actions/checkout@v6
      - name: Compute mise tool cache key
        run: python3 scripts/ci-cache.py mise-tools-hash --github-env
      - uses: jdx/mise-action@v5
        with:
          cache_key: '{{cache_key_prefix}}-{{platform}}-p{{cache_period}}-{{env.MISE_TOOLS_HASH}}'
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ~/Library/Caches/canban
          shared-key: ci-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Install build and integration test dependencies
        env:
          HC_VERSION: '0.1.21'
        run: |
          if ! command -v rsvg-convert >/dev/null 2>&1; then
            brew install librsvg
          fi
          mkdir -p "$HOME/.local/bin"
          curl --retry 3 --retry-all-errors -fsSL https://releases.herdr.dev/core/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run lint
        run: mise run lint
      - name: Run unit tests
        if: ${{ !cancelled() }}
        run: mise run test
      - name: Run Deterministic Simulation Testing (DST)
        if: ${{ !cancelled() }}
        run: |
          mise exec -- cargo run --release --locked -p canban-sim --bin canban-sim -- corpus --jobs 4 --seed-timeout 60
          mise exec -- cargo run --release --locked -p canban-sim --bin canban-sim -- run --seeds 1 --assert-coverage --seed-timeout 60
          mise exec -- cargo run --release --locked -p canban-sim --bin canban-sim -- random --scenario chaos --seeds 12 --jobs 4 --master-seed 2026 --seed-timeout 60 --assert-coverage
      - name: Run script and packaging tests
        if: ${{ !cancelled() }}
        run: |
          mise run test-release
          mise run test-package
          mise run test-dev
      - name: Run integration tests
        if: ${{ !cancelled() }}
        run: mise run test-integration
      - name: Run installer tests
        if: ${{ !cancelled() }}
        run: /usr/bin/python3 scripts/run-acceptance.py -- scripts/test-install.py
      - name: Validate candidate upgrade from latest published release
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 scripts/run-acceptance.py -- scripts/test-release-upgrade.py
      - name: Summarize unit test JUnit report
        if: always()
        run: python3 scripts/run-acceptance.py --junit-summary target/nextest/ci/junit.xml
      - name: Upload CI failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-macos-logs-${{ github.run_attempt }}
          path: |
            target/acceptance-logs/
            target/nextest/ci/junit.xml
            .local/sim-failures/
          if-no-files-found: ignore

  linux:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    env:
      CANBAN_UPDATES_DISABLED: '1'
      CARGO_INCREMENTAL: '0'
      CANBAN_ACCEPTANCE_RETRIES: '1'
    steps:
      - uses: actions/checkout@v6
      - name: Compute mise tool cache key
        run: python3 scripts/ci-cache.py mise-tools-hash --github-env
      - uses: jdx/mise-action@v5
        with:
          cache_key: '{{cache_key_prefix}}-{{platform}}-p{{cache_period}}-{{env.MISE_TOOLS_HASH}}'
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ~/.cache/canban
          shared-key: ci-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Install Linux desktop build and test dependencies
        env:
          HC_VERSION: '0.1.21'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-4-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            librsvg2-bin \
            zstd
          mkdir -p "$HOME/.local/bin"
          curl --retry 3 --retry-all-errors -fsSL https://releases.herdr.dev/core/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run Linux script and packaging tests
        run: |
          mise run test-release
          mise run test-package
          mise run test-dev
      - name: Build Linux desktop bundle
        if: ${{ !cancelled() }}
        run: mise run build
      - name: Run Linux installer regression tests
        if: ${{ !cancelled() }}
        run: python3 scripts/run-acceptance.py -- scripts/test-install.py --bundle .local/canban
      - name: Run Deterministic Simulation Testing (DST)
        if: ${{ !cancelled() }}
        run: |
          mise exec -- cargo run --release --locked -p canban-sim --bin canban-sim -- corpus --jobs 4 --seed-timeout 60
          mise exec -- cargo run --release --locked -p canban-sim --bin canban-sim -- run --seeds 1 --assert-coverage --seed-timeout 60
          mise exec -- cargo run --release --locked -p canban-sim --bin canban-sim -- random --scenario chaos --seeds 12 --jobs 4 --master-seed 2026 --seed-timeout 60 --assert-coverage
      - name: Upload CI failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-linux-${{ matrix.arch }}-logs-${{ github.run_attempt }}
          path: |
            target/acceptance-logs/
            .local/sim-failures/
          if-no-files-found: ignore

  cache-prune:
    needs: [macos, linux]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
      - name: Prune superseded GitHub Actions caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-cache.py prune --keep-per-bucket 1 --best-effort
