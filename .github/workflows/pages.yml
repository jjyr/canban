name: Deploy Website
on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'scripts/install.sh'
      - 'scripts/website.py'
      - 'scripts/test-website.py'
      - 'mise.toml'
      - '.github/workflows/pages.yml'
  release:
    types: [published, edited, deleted, unpublished]
  # Releases published using GITHUB_TOKEN do not trigger another release workflow.
  workflow_run:
    workflows: ['Release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: 'pages-build'
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Editing an old release must not restore the website from its old tag.
          ref: ${{ (github.event_name == 'release' || github.event_name == 'workflow_run') && github.event.repository.default_branch || github.sha }}
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Validate website generator
        run: python3 scripts/test-website.py
      - name: Build localized pages and current release history
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/website.py --refresh-releases
      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.local/website'

  deploy:
    needs: build
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
