<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Canban app icon — Terminal Kanban: a neon prompt chevron followed by an underscore split into the
       three Board columns; the last segment is the orange cursor where the Agent is working. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081320"/>
      <stop offset="1" stop-color="#020408"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.47" cy="0.52" r="0.42">
      <stop offset="0" stop-color="#00C8F0" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#00C8F0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraO" cx="0.743" cy="0.62" r="0.16">
      <stop offset="0" stop-color="#FF5A0A" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#FF5A0A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8CF6FF"/>
      <stop offset="0.45" stop-color="#2BE4FF"/>
      <stop offset="1" stop-color="#00B4E6"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB45E"/>
      <stop offset="1" stop-color="#FF560A"/>
    </linearGradient>
    <!-- Two-layer neon: wide soft bloom + tight halo -->
    <filter id="neonC" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="24" result="wide"/>
      <feFlood flood-color="#00D2FF" flood-opacity="0.22"/><feComposite in2="wide" operator="in" result="wideC"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="tight"/>
      <feFlood flood-color="#30E8FF" flood-opacity="0.5"/><feComposite in2="tight" operator="in" result="tightC"/>
      <feMerge><feMergeNode in="wideC"/><feMergeNode in="tightC"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neonO" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="24" result="wide"/>
      <feFlood flood-color="#FF4A00" flood-opacity="0.32"/><feComposite in2="wide" operator="in" result="wideC"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="tight"/>
      <feFlood flood-color="#FF7A1A" flood-opacity="0.55"/><feComposite in2="tight" operator="in" result="tightC"/>
      <feMerge><feMergeNode in="wideC"/><feMergeNode in="tightC"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#aura)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#auraO)"/>

    <!-- Prompt chevron: 45° arms, flat horizontal ends (x 230–486, y 352–672) -->
    <polygon points="230,352 326,352 486,512 326,672 230,672 390,512" fill="url(#cyan)" filter="url(#neonC)"/>

    <!-- Underscore split into three Board columns, baseline-aligned with the chevron -->
    <rect x="530" y="604" width="72" height="68" fill="url(#cyan)" filter="url(#neonC)"/>
    <rect x="626" y="604" width="72" height="68" fill="url(#cyan)" filter="url(#neonC)"/>
    <rect x="722" y="604" width="72" height="68" fill="url(#orange)" filter="url(#neonO)"/>
  </g>

  <!-- Hairline rim -->
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#3FE6FF" stroke-opacity="0.18" stroke-width="4"/>
</svg>
