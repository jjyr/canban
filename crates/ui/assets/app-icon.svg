<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Canban app icon: an Agent's robot hand hands you a Kanban board. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#F6F8FF"/>
      <stop offset="1" stop-color="#DEE7FA"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B9C3D3"/>
      <stop offset="1" stop-color="#97A3B8"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1B2A4A" flood-opacity="0.22"/>
    </filter>
    <filter id="boardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#2A4A9A" flood-opacity="0.20"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-40%" width="160%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#2F6BFF" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#iconShadow)"/>

  <g clip-path="url(#squircle)">
    <!-- Robot hand behind the board, scaled up and cropped at the lower-left -->
    <g transform="translate(256 630) rotate(-2) scale(1.3) translate(-312 -600)">
      <!-- Forearm and wrist -->
      <g transform="rotate(37 270 735)">
        <rect x="208" y="745" width="124" height="320" rx="34" fill="url(#arm)"/>
        <rect x="254" y="770" width="16" height="280" rx="8" fill="#CBD3E0"/>
        <!-- Wrist band with glowing ring -->
        <rect x="192" y="708" width="156" height="58" rx="26" fill="#4B5568"/>
        <rect x="204" y="725" width="132" height="24" rx="12" fill="#3B82F6" filter="url(#glow)" opacity="0.9"/>
        <rect x="206" y="729" width="128" height="16" rx="8" fill="#5FA0FF"/>
      </g>
      <!-- Palm -->
      <g transform="rotate(37 330 655)">
        <rect x="258" y="580" width="144" height="150" rx="42" fill="#A3AEC1"/>
        <rect x="258" y="580" width="62" height="150" rx="31" fill="#8C98AE"/>
      </g>
      <!-- Fingers curled under the board's bottom edge -->
      <g transform="rotate(7 565 465)">
        <rect x="350" y="614" width="104" height="46" rx="23" fill="#9DA9BD"/>
        <circle cx="456" cy="637" r="18" fill="#5E6A80"/>
        <rect x="462" y="616" width="74" height="42" rx="21" fill="#B3BDCE"/>
        <rect x="338" y="658" width="92" height="42" rx="21" fill="#8C98AE"/>
        <circle cx="432" cy="679" r="16" fill="#5E6A80"/>
        <rect x="438" y="660" width="62" height="38" rx="19" fill="#A3AEC1"/>
      </g>
    </g>

    <!-- Kanban board: Backlog 2, Develop 1, Review 2 with the just-finished card raised -->
    <g transform="rotate(5 548 470)">
      <rect x="248" y="285" width="600" height="370" rx="32" fill="#FFFFFF" filter="url(#boardShadow)"/>
      <rect x="272" y="309" width="172" height="322" rx="20" fill="#EDF2FF"/>
      <rect x="462" y="309" width="172" height="322" rx="20" fill="#E4F6F1"/>
      <rect x="652" y="309" width="172" height="322" rx="20" fill="#FFF3DC"/>
      <rect x="284" y="323" width="148" height="76" rx="18" fill="#A9C4FF"/>
      <rect x="284" y="415" width="148" height="76" rx="18" fill="#A9C4FF"/>
      <rect x="474" y="323" width="148" height="76" rx="18" fill="#8EDCCB"/>
      <rect x="664" y="323" width="148" height="76" rx="18" fill="#FFC864"/>
      <rect x="654" y="409" width="168" height="88" rx="20" fill="#2F6BFF" filter="url(#cardShadow)"/>
    </g>

    <!-- Thumb pressing the board's front face -->
    <g transform="translate(256 630) rotate(-2) scale(1.3) translate(-312 -600)">
      <g transform="rotate(53 305 625)">
        <rect x="276" y="526" width="58" height="104" rx="29" fill="#A3AEC1"/>
        <circle cx="305" cy="532" r="20" fill="#5E6A80"/>
        <rect x="279" y="440" width="52" height="96" rx="26" fill="#C3CCDB"/>
        <rect x="289" y="454" width="12" height="56" rx="6" fill="#DDE3EC"/>
      </g>
    </g>
  </g>
</svg>
