[package]
name = "canban-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
canban-profiler.workspace = true
canban-github.workspace = true
canban-workflow-engine.workspace = true
canban-updater.workspace = true
canban-themes.workspace = true
chrono.workspace = true
anyhow.workspace = true
url = "2"
serde_json.workspace = true
serde.workspace = true
signal-hook = { version = "0.3", default-features = false }
base64.workspace = true
nsh-core.workspace = true
nsh-base.workspace = true
canban-types.workspace = true
canban-profiles.workspace = true
canban-context.workspace = true
canban-scheduler.workspace = true
canban-notifications.workspace = true
canban-terminal.workspace = true
canban-ui-kit.workspace = true
canban-app-server.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux.workspace = true

[[bin]]
name = "canban-ui"
path = "src/main.rs"

[[example]]
name = "gallery"
path = "../../examples/gallery/main.rs"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
