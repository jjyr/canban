[tools]
rust = "beta-2026-10-14"
zig = "0.17.1"

[tasks.terminal-deps]
run = "/usr/bin/python3 scripts/terminal-deps.py"

[tasks.check]
depends = ["terminal-deps"]
run = "cargo check --workspace"

[tasks.test]
depends = ["terminal-deps"]
run = "cargo test --workspace"

[tasks.run]
depends = ["build"]
run = "/usr/bin/python3 scripts/dev.py"

[tasks.build]
depends = ["terminal-deps"]
run = ["cargo build -p canban-ui -p canban-cli -p canban-updater", "/usr/bin/python3 scripts/package.py"]

[tasks.build-gallery]
depends = ["terminal-deps"]
run = ["cargo build -p canban-ui --example gallery", "/usr/bin/python3 scripts/package.py --gallery"]

[tasks.gallery]
depends = ["build-gallery"]
run = ".local/CanbanGallery.app/Contents/MacOS/gallery"

[tasks.acceptance-dev]
depends = ["build"]
run = "/usr/bin/python3 scripts/acceptance-dev.py"

[tasks.acceptance-notifications]
depends = ["build"]
run = "/usr/bin/python3 scripts/acceptance-notifications.py"

[tasks.acceptance]
depends = ["build"]
run = "/usr/bin/python3 scripts/acceptance.py"

[tasks.acceptance-real]
depends = ["build"]
run = "/usr/bin/python3 scripts/acceptance-real.py"

[tasks.acceptance-interactive]
depends = ["build"]
run = "/usr/bin/python3 scripts/acceptance-interactive.py"

[tasks.acceptance-real-interactive]
depends = ["build"]
run = "/usr/bin/python3 scripts/acceptance-real-interactive.py"

[tasks.acceptance-real-claude]
depends = ["build"]
run = "/usr/bin/python3 scripts/acceptance-real-claude.py"

[tasks.acceptance-real-workflows]
depends = ["build"]
run = "/usr/bin/python3 scripts/acceptance-real-workflows.py"

[tasks.acceptance-native]
depends = ["build"]
run = "/usr/bin/python3 scripts/acceptance-native.py"

[tasks.acceptance-scheduling]
depends = ["build"]
run = "/usr/bin/python3 scripts/acceptance-scheduling.py"

[tasks.acceptance-overview]
depends = ["build"]
run = "/usr/bin/python3 scripts/acceptance-overview.py"

[tasks.acceptance-terminals]
depends = ["build"]
run = "/usr/bin/python3 scripts/acceptance-terminals.py"

[tasks.acceptance-terminal-context]
depends = ["build"]
run = "/usr/bin/python3 scripts/acceptance-terminal-context.py"

[tasks.acceptance-retained]
depends = ["build"]
run = "/usr/bin/python3 scripts/acceptance-retained.py"

[tasks.acceptance-events]
depends = ["build"]
run = "/usr/bin/python3 scripts/acceptance-events.py"

[tasks.build-release]
depends = ["terminal-deps"]
run = ["cargo build --release --locked -p canban-ui -p canban-cli -p canban-updater", "/usr/bin/python3 scripts/package.py --release"]

[tasks.acceptance-updates]
run = "/usr/bin/python3 scripts/acceptance-updates.py"

[tasks.test-release]
run = "/usr/bin/python3 scripts/test-release.py"

[tasks.test-package]
run = "/usr/bin/python3 scripts/test-package.py"

[tasks.acceptance-github-workspace]
depends = ["build"]
run = "/usr/bin/python3 scripts/acceptance-github-workspace.py"

[tasks.acceptance-github-native]
depends = ["build"]
run = "/usr/bin/python3 scripts/acceptance-github-workspace.py --native"

[tasks.acceptance-editor]
depends = ["build"]
run = "/usr/bin/python3 scripts/acceptance-editor.py"

[tasks.acceptance-workflows]
depends = ["build"]
run = "/usr/bin/python3 scripts/acceptance-workflows.py"
