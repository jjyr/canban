[tools]
hk = "2.4.0"
rust = "beta-2026-10-14"
zig = "0.17.1"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.152"

[tasks.terminal-deps]
run = "python3 scripts/terminal-deps.py"

[tasks.build-website]
description = "Generate the bilingual static website (pass --refresh-releases for current GitHub releases)"
run = "python3 scripts/website.py"

[tasks.test-website]
description = "Check localized website metadata, links, FAQ, and safe release rendering"
run = "python3 scripts/test-website.py"

[tasks.check]
description = "Check Rust formatting, compilation, and Clippy without running tests or packaging"
depends = ["terminal-deps"]
run = [
  "cargo fmt --all -- --check",
  "cargo check --workspace --all-targets --locked",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
]

[tasks.check-ios]
description = "Cross-compile canban-terminal (libghostty-vt) for iOS device and simulator"
depends = ["terminal-deps"]
env = { IPHONEOS_DEPLOYMENT_TARGET = "14.0" }
run = [
  "rustup target add aarch64-apple-ios aarch64-apple-ios-sim",
  "cargo build -p canban-terminal --no-default-features --locked --target aarch64-apple-ios-sim --example vt_smoke",
  "cargo build -p canban-terminal --no-default-features --locked --target aarch64-apple-ios --example vt_smoke",
]

[tasks.test]
depends = ["terminal-deps"]
env = { CANBAN_UPDATES_DISABLED = "1", CANBAN_GH_BIN = "/usr/bin/false" }
run = "cargo nextest run --workspace --locked"

[tasks.run]
depends = ["build-binaries"]
run = "python3 scripts/dev.py start"

[tasks.dev]
depends = ["build-binaries"]
run = "python3 scripts/dev.py start"

[tasks.dev-stop]
run = "python3 scripts/dev.py stop"

[tasks.build-binaries]
depends = ["terminal-deps"]
run = "cargo build -p canban-ui -p canban-cli -p canban-updater"

[tasks.build]
depends = ["build-binaries"]
run = "python3 scripts/package.py"

[tasks.build-gallery]
depends = ["terminal-deps"]
run = ["cargo build -p canban-ui --example gallery", "python3 scripts/package.py --gallery"]

[tasks.gallery]
depends = ["build-gallery"]
run = 'if [ "$(uname -s)" = "Darwin" ]; then exec .local/CanbanGallery.app/Contents/MacOS/gallery; else exec .local/canban-gallery/bin/canban-gallery; fi'

[tasks.acceptance-dev]
depends = ["build"]
run = "python3 scripts/acceptance-dev.py"

[tasks.acceptance-notifications]
depends = ["build"]
run = "python3 scripts/acceptance-notifications.py"

[tasks.acceptance]
depends = ["build"]
run = "python3 scripts/acceptance.py"

[tasks.acceptance-agent-interface]
depends = ["build"]
run = 'python3 scripts/acceptance-agent-interface.py --output "${CANBAN_RUN_DIR:-/tmp}/canban-interface-acceptance"'

[tasks.acceptance-real]
depends = ["build"]
run = "python3 scripts/acceptance-real.py"

[tasks.acceptance-interactive]
depends = ["build"]
run = "python3 scripts/acceptance-interactive.py"

[tasks.acceptance-real-interactive]
depends = ["build"]
run = "python3 scripts/acceptance-real-interactive.py"

[tasks.acceptance-real-claude]
depends = ["build"]
run = "python3 scripts/acceptance-real-claude.py"

[tasks.acceptance-real-workflows]
depends = ["build"]
run = "python3 scripts/acceptance-real-workflows.py"

[tasks.acceptance-native]
depends = ["build"]
run = "python3 scripts/acceptance-native.py"

[tasks.acceptance-scheduling]
depends = ["build"]
run = "python3 scripts/acceptance-scheduling.py"

[tasks.acceptance-overview]
depends = ["build"]
run = "python3 scripts/acceptance-overview.py"

[tasks.acceptance-terminals]
depends = ["build"]
run = "python3 scripts/acceptance-terminals.py"

[tasks.acceptance-terminal-context]
depends = ["build"]
run = "python3 scripts/acceptance-terminal-context.py"

[tasks.acceptance-retained]
depends = ["build"]
run = "python3 scripts/acceptance-retained.py"

[tasks.acceptance-events]
depends = ["build"]
run = "python3 scripts/acceptance-events.py"

[tasks.build-release]
depends = ["terminal-deps"]
run = ["cargo build --release --locked -p canban-ui -p canban-cli -p canban-updater", "python3 scripts/package.py --release"]

[tasks.release]
run = "python3 scripts/release.py dispatch"

[tasks.install-app]
depends = ["build-release"]
run = "python3 scripts/install-app.py"

[tasks.acceptance-updates]
run = "python3 scripts/acceptance-updates.py"

[tasks.acceptance-backend]
depends = ["build"]
run = "python3 scripts/acceptance-backend.py"

[tasks.test-release]
run = "python3 scripts/test-release.py"

[tasks.test-package]
run = "python3 scripts/test-package.py"

[tasks.test-dev]
run = "python3 scripts/test-dev.py"

[tasks.test-install]
depends = ["build"]
run = "python3 scripts/test-install.py"

[tasks.test-release-upgrade]
depends = ["build"]
run = "python3 scripts/test-release-upgrade.py"

[tasks.test-integration]
depends = ["build"]
run = "python3 scripts/run-acceptance.py --suite integration"

[tasks.acceptance-github-workspace]
depends = ["build"]
run = "python3 scripts/acceptance-github-workspace.py"

[tasks.acceptance-github-native]
depends = ["build"]
run = "python3 scripts/acceptance-github-workspace.py --native"

[tasks.acceptance-editor]
depends = ["build"]
run = "python3 scripts/acceptance-editor.py"

[tasks.acceptance-workflows]
depends = ["build"]
run = "python3 scripts/acceptance-workflows.py"

[tasks.acceptance-adoption]
depends = ["build"]
run = "python3 scripts/acceptance-adoption.py"

[tasks.acceptance-agent-launch]
depends = ["terminal-deps"]
run = "cargo nextest run --workspace --locked --run-ignored only -E 'package(canban-profiles) & test(real_codex_thread_environment_isolation)'"

[tasks.build-profiling]
depends = ["terminal-deps"]
run = ["cargo build --profile profiling --locked -p canban-ui -p canban-cli -p canban-updater", "python3 scripts/package.py --profile profiling"]

[tasks.profile]
run = "python3 scripts/profile.py"

[tasks.acceptance-insights]
depends = ["build"]
run = "python3 scripts/acceptance-insights.py"
