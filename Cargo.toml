[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["JJy <jjyruby@gmail.com>"]
description = "Turn Kanban cards into automated coding workflows without replacing your native agent CLIs."
homepage = "https://canban.dev"
repository = "https://github.com/jjyr/canban"
keywords = ["kanban", "ai-agents", "workflow", "git-worktree", "terminal"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "process"] }
yamux = "0.14"
futures-io = "0.3"
futures-util = "0.3"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
tar = "0.4"
zstd = "0.13"
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "071c6e2fc1526ce70f6ccc8cb6b9936f168f1d7d", features = ["svg"] }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "071c6e2fc1526ce70f6ccc8cb6b9936f168f1d7d", default-features = false, features = ["editor", "highlight", "term"] }
nsh-platform-macos = { git = "https://github.com/longbridge/nsh", rev = "071c6e2fc1526ce70f6ccc8cb6b9936f168f1d7d", default-features = false }
nsh-platform-linux = { git = "https://github.com/longbridge/nsh", rev = "071c6e2fc1526ce70f6ccc8cb6b9936f168f1d7d", default-features = false, features = ["shader", "editor", "highlight", "term"] }
nsh-platform-ios = { git = "https://github.com/longbridge/nsh", rev = "071c6e2fc1526ce70f6ccc8cb6b9936f168f1d7d", default-features = false, features = ["editor", "highlight", "term", "svg"] }
nsh-platform-android = { git = "https://github.com/longbridge/nsh", rev = "071c6e2fc1526ce70f6ccc8cb6b9936f168f1d7d", default-features = false, features = ["editor", "highlight", "term", "svg"] }
canban-profiler = { path = "crates/profiler" }
canban-exec = { path = "crates/exec" }
canban-themes = { path = "crates/themes" }
canban-types = { path = "crates/types" }
canban-usage = { path = "crates/usage" }
canban-github = { path = "crates/github" }
canban-profiles = { path = "crates/profiles" }
canban-updater = { path = "crates/updater" }
canban-storage = { path = "crates/storage" }
canban-kanban = { path = "crates/kanban" }
canban-context = { path = "crates/context" }
canban-timeline = { path = "crates/timeline" }
canban-notifications = { path = "crates/notifications" }
canban-workflow-engine = { path = "crates/workflow-engine" }
canban-scheduler = { path = "crates/scheduler" }
canban-herdr = { path = "crates/herdr" }
canban-workspaces = { path = "crates/workspaces" }
canban-transport = { path = "crates/transport" }
canban-app-server = { path = "crates/app-server" }
canban-sync = { path = "crates/sync" }
canban-client = { path = "crates/client" }
canban-ui-kit = { path = "crates/ui-kit" }
canban-terminal = { path = "crates/terminal" }

[profile.dev]
debug = 0

[profile.test]
debug = 0

# Release-like optimization with symbols retained for Instruments / allocation stacks.
[profile.profiling]
inherits = "release"
debug = 2
strip = "none"
